# rules.yaml — per-organism scoring config (generic default)
clustering:
  pad: 500
  # The strand test blocks a merge only when both sides are stranded (ShortStack
  # strand_cutoff, under `extractor`) and on opposite strands, and both carry at
  # least this much 1/NH-weighted read mass (a fraction on fewer reads is noise).
  # No published tool splits neighbours on strand (ShortStack, PHASIS, PhaseTank,
  # PICB split on gap only; strand is a label). The rule is ours, kept because
  # removing it lost piRNA recall in fly (0.951 -> 0.906) and PHAS21 recall in
  # rice (0.855 -> 0.717) on tuning libraries; 20 chosen from {10, 20, none}.
  # null (or absent) means the strand test never blocks.
  strand_min_reads: 20
  # Locus floor (user decision 2026-11-06): a region below it is not a locus; it goes to <prefix>.fragments.tsv. trim_to_reads bounds each locus by its reads instead of padding. Values set by tuning-only calibration (fly, Arabidopsis, rice).
  # Calibration (fly SRR30544370, Arabidopsis SRR24236124, rice DRR076318; grid
  # trim off/on x {none, 10r/30bp, 10r/50bp, 20r/50bp}): 20 reads / 50 bp is the
  # strictest setting with no class losing > 0.01 recall or precision versus trim
  # alone; fragments hold <= 0.3% of the read mass. Trimming costs Arabidopsis
  # hcsiRNA recall 0.718 -> 0.705 (credit the padding earned over regions without
  # reads) and gains phasiRNA precision 0.229 -> 0.247; kept (ruling 2026-11-06).
  locus_min_reads: 20
  locus_min_span: 50
  trim_to_reads: true
extractor:
  dicermin: 18
  dicermax: 35
  strand_cutoff: 0.8
decision:
  review_confidence: 0.6
  # No-op while there are only two classes: with a two-way softmax,
  # confidence < 0.6 already implies margin < ln(1.5) ~= 0.405, so any
  # min_margin below that never fires on its own. Kept because it becomes
  # meaningful again as soon as a third class is added.
  min_margin: 0.15
  # Weighted (1/NH) read count below which a locus is flagged for review.
  # Raising it does not help: it only relabels loci without retaining more
  # signal (see the calibration table in the README) — filter noise with
  # --mincov instead.
  min_reads: 10
# Size is a defining evidence, not only a weight: `w_size` picks the class, but
# without `size` in this list the reported `score` ignores it, so a locus with a
# perfect size profile and a weak signature scored the same as one with no
# evidence at all. The score is the minimum over this list, so adding size makes
# it strictly more conservative: it now says the size fits AND the signature is
# there. The null is the window's share of the 18-35 nt range the extractor
# keeps, so a locus with no size preference scores 0.
classes:
  siRNA:
    size: {lo: 20, hi: 22}
    w_size: 1.0
    w_fractop_mid: 1.0        # rewards FracTop ~0.5 (double-stranded)
    w_pingpong_penalty: 1.0   # penalizes ping-pong (size-gated, like w_pingpong)
    w_phase: 0.5
    defining_evidence: [fractop_bid, size]
  piRNA:
    size: {lo: 24, hi: 31}
    w_size: 1.0
    # Gated by this class's own size window (see decider._score_class): outside
    # 24-31nt the ping-pong bonus fades out, so a dual-strand 21-nt endo-siRNA
    # locus is not dragged into piRNA by 10-nt overlaps it gets from geometry.
    w_pingpong: 1.5
    w_1u: 1.0
    w_phase: 0.5
    # piRNA-cluster criterion (proTRAC, Rosenkranz & Zischler 2012, BMC
    # Bioinformatics 13:5: min cluster size 1 kb, hit-density p = 0.01). A locus
    # that wins as piRNA but fails either is reported ambiguous (review), per the
    # user's decision; it never changes which class wins. Optional, any class.
    cluster_min_length: 1000
    cluster_max_density_pvalue: 0.01
    defining_evidence: [[1u, pingpong], size]
