# rules.yaml — per-organism scoring config (generic default)
extractor:
  dicermin: 18
  dicermax: 35
  strand_cutoff: 0.8
decision:
  review_confidence: 0.6
  # No-op while there are only two classes: with a two-way softmax,
  # confidence < 0.6 already implies margin < ln(1.5) ~= 0.405, so any
  # min_margin below that never fires on its own. Kept because it becomes
  # meaningful again as soon as a third class is added.
  min_margin: 0.15
  # Weighted (1/NH) read count below which a locus is flagged for review.
  # Raising it does not help: it only relabels loci without retaining more
  # signal (see the calibration table in the README) — filter noise with
  # --mincov instead.
  min_reads: 10
classes:
  siRNA:
    size: {lo: 20, hi: 22}
    w_size: 1.0
    w_fractop_mid: 1.0        # rewards FracTop ~0.5 (double-stranded)
    w_pingpong_penalty: 1.0   # penalizes ping-pong (size-gated, like w_pingpong)
    w_phase: 0.5
  piRNA:
    size: {lo: 24, hi: 31}
    w_size: 1.0
    # Gated by this class's own size window (see decider._score_class): outside
    # 24-31nt the ping-pong bonus fades out, so a dual-strand 21-nt endo-siRNA
    # locus is not dragged into piRNA by 10-nt overlaps it gets from geometry.
    w_pingpong: 1.5
    w_1u: 1.0
    w_phase: 0.5
