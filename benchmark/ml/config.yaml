# ML classifier settings (benchmark/ml)
min_overlap_frac: 0.5   # a locus takes the class of the truth region match_loci picks at this overlap
folds:                  # fold rule of Task 5 (leave-one-unit-out)
  min_share: 0.05       # a chromosome holding >= 5% of its species' loci is its own fold unit;
                        # smaller contigs are pooled into "other"
