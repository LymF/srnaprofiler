# ML classifier settings (benchmark/ml)
min_overlap_frac: 0.5   # a locus takes the class of the truth region match_loci picks at this overlap
folds:                  # fold rule of Task 5 (leave-one-unit-out)
  min_share: 0.05       # a chromosome holding >= 5% of its species' loci is its own fold unit;
                        # smaller contigs are pooled into "other"
controls:               # organism -> benchmark/truth/<dir>/controls.bed (generated on the server, not committed)
  Drosophila melanogaster: dmel
  Arabidopsis thaliana: atha
  Oryza sativa: osat
  Zea mays: zmay
  Bombyx mori: bmor
te:                     # organism -> transposon BED relative to benchmark/truth/ (built from UCSC
                        # rmsk by benchmark/scripts/build_te.py, not committed). Organisms without an
                        # entry: piRNA "supported" = reproducibility only.
  Drosophila melanogaster: dmel/rmsk_te.bed
selection:              # criterion v2 (spec section 3)
  class_floor: 0.02     # no class may lose more than this precision or recall vs the rules
  alpha: 0.05           # corrected resampled t-test on macro-F1 vs the rules
