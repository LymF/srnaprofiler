# rules.plant.yaml — scoring config for PLANTS.
#
# STATUS: calibrated and validated on SRR30831721 (Arabidopsis Col-0 flower
# buds, 24.1M reads, BioProject PRJNA1011929). All six TAS loci come out as
# phasiRNA at 21nt, and the genome is 82% 24-nt hcsiRNA with 5'A enriched there
# (0.512) against 21-22nt (0.330). See docs/ROADMAP.md item 14.
# Validated on ONE dataset of ONE tissue of ONE species: treat as a good
# starting point for another plant, not as a universal default.
#
# Why a separate file at all — plants are not arthropods:
#   * There is no piRNA class: plants have no PIWI proteins.
#   * There is no ping-pong cycle either, for the same reason, so no w_pingpong.
#   * The 24-nt window, which in arthropods is piRNA territory, belongs to
#     heterochromatic siRNA (DCL3 -> AGO4, the RdDM pathway) and is one of the
#     most abundant classes in vegetative tissue.
#   * The 5' base sorts the small RNA into an Argonaute: 5'U -> AGO1 (miRNA,
#     tasiRNA/phasiRNA), 5'A -> AGO4 (hc-siRNA). Hence w_1u and w_5a.
#
# miRNA is not scored here: as in the arthropod config it comes from
# --mirna-loci (overlap with a curated BED) and bypasses the scorer.
clustering:
  pad: 500
  # The strand test blocks a merge only when both sides are stranded (ShortStack
  # strand_cutoff, under `extractor`) and on opposite strands, and both carry at
  # least this much 1/NH-weighted read mass (a fraction on fewer reads is noise).
  # No published tool splits neighbours on strand (ShortStack, PHASIS, PhaseTank,
  # PICB split on gap only; strand is a label). The rule is ours, kept because
  # removing it lost piRNA recall in fly (0.951 -> 0.906) and PHAS21 recall in
  # rice (0.855 -> 0.717) on tuning libraries; 20 chosen from {10, 20, none}.
  # null (or absent) means the strand test never blocks.
  strand_min_reads: 20
  # Locus floor (user decision 2026-11-06): a region below it is not a locus; it goes to <prefix>.fragments.tsv. trim_to_reads bounds each locus by its reads instead of padding. Values set by tuning-only calibration (fly, Arabidopsis, rice).
  # Calibration (fly SRR30544370, Arabidopsis SRR24236124, rice DRR076318; grid
  # trim off/on x {none, 10r/30bp, 10r/50bp, 20r/50bp}): 20 reads / 50 bp is the
  # strictest setting with no class losing > 0.01 recall or precision versus trim
  # alone; fragments hold <= 0.3% of the read mass. Trimming costs Arabidopsis
  # hcsiRNA recall 0.718 -> 0.705 (credit the padding earned over regions without
  # reads) and gains phasiRNA precision 0.229 -> 0.247; kept (ruling 2026-11-06).
  locus_min_reads: 20
  locus_min_span: 50
  # A narrow stack with >= 100 reads is real expression (e.g. an unannotated miRNA or tRNA/snoRNA fragment), not a leftover piece; it stays a locus and the classifier decides it (ruling 2026-11-06 after final review).
  locus_span_exempt_reads: 100
  trim_to_reads: true
extractor:
  dicermin: 18
  dicermax: 35
  strand_cutoff: 0.8
decision:
  # 0.43 here is as strict as the 0.6 the arthropod config uses, NOT looser.
  # The threshold is on a softmax, so its meaning depends on how many classes
  # compete. With two classes, conf >= 0.6 means a margin of ln(1.5) = 0.405
  # over the rival. With three, it means e^m/(e^m+2) >= 0.6, i.e. a margin of
  # 1.10 -- nearly three times stricter by accident. 0.43 restores the intended
  # 0.41 margin. Keeping 0.6 sent 39.6% of loci to review on confidence alone.
  review_confidence: 0.43
  min_margin: 0.15
  # Review flag for loci with a weighted (1/NH) read count below this. Inert with
  # the shipped locus floor: every non-miRNA locus already has
  # >= clustering.locus_min_reads (20) and carved miRNA loci are not decided,
  # so this only fires if the floor is lowered below it or switched off.
  min_reads: 10
# Size is a defining evidence, not only a weight: `w_size` picks the class, but
# without `size` in this list the reported `score` ignores it, so a locus with a
# perfect size profile and a weak signature scored the same as one with no
# evidence at all. The score is the minimum over this list, so adding size makes
# it strictly more conservative: it now says the size fits AND the signature is
# there. The null is the window's share of the 18-35 nt range the extractor
# keeps, so a locus with no size preference scores 0.
classes:
  # DCL4 products from RDR6 dsRNA: 21 nt, strongly phased (that is the defining
  # evidence), 5'U, loaded into AGO1.
  #
  # Calibrated on SRR30831721 (Col-0 flower buds) against the six TAS loci:
  #   * w_size is deliberately LOW (0.5) and w_phase HIGH. With w_size at 1.0 the
  #     size window alone carried the class, so every 21-22nt locus landed here
  #     regardless of phasing: 6557 loci, of which only 2.8% had any phasing
  #     evidence, while the siRNA class was left with 311. Now the class costs
  #     real phasing to enter.
  #   * phase_scale 1.5 instead of the default 3.0: the wide sigmoid returned
  #     0.159 for a phase_score of ZERO, handing out 0.24 of free score. The
  #     narrow one gives 0.035.
  #   * w_1u is low because in this tissue 5'U barely separates 21-22nt loci
  #     (mean 0.345) from the 5'A background (0.330).
  # Result: 1136 phasiRNA loci, siRNA in use (2715), and all six TAS loci
  # recovered (see extras/validate_plant_tas.py).
  phasiRNA:
    size: {lo: 21, hi: 22}
    w_size: 0.5
    w_phase: 3.0
    phase_x0: 5.0
    phase_scale: 1.5
    w_1u: 0.3
    defining_evidence: [phase, size]
    # 4 phase cycles of read span (21/24 nt x 4): fewer cycles cannot show phasing; PhaseTank requires >= 4 phased reads within 84 nt (Guo et al., 2015). Below it the locus is downgraded to ambiguous/review (user decision 2026-11-06).
    cluster_min_length: 84
  # Reproductive phasiRNA: 24 nt, phased, from DCL5 (DCL3b) on miR2275-triggered
  # precursors. A monocot pathway -- Arabidopsis has no DCL5, and measured there
  # this class takes ZERO loci, which is the right answer and the specificity
  # control for it.
  #
  # `phase_on: cycles` is not decoration. With the default (a sigmoid over
  # phase_score) this class took 2006 hc-siRNA loci in Arabidopsis: they are 5x
  # deeper than the ones that stayed (555 vs 112 reads), their phase_pvalue is
  # 1.000, and they hit p <= 0.01 at 1.1% against a 0.9% background. phase_score
  # carries a ln(mass) factor, so against a class holding 96% of the loci it
  # selects depth. Reading the run in register instead drops that to zero.
  #
  # The 21-nt class keeps the default on purpose: switching IT to cycles loses 5
  # of the 12 experimentally characterised TAS loci to siRNA. There the abundance
  # term earns its place; here it does not.
  #
  # w_phase 4.0 makes a full 11-cycle run beat hcsiRNA. It is NOT calibrated
  # against truth yet -- Arabidopsis cannot calibrate a pathway it lacks. Rice
  # (804 PHAS24 loci in sRNAanno) is where that number gets tested.
  phasiRNA24:
    # ON, because the phasing gate below is what makes it safe. This is a
    # MONOCOT pathway: 24-nt reproductive phasiRNA come from DCL5, which rice
    # and maize have and Arabidopsis does not -- so Arabidopsis is the
    # specificity control, and it should get ~0 calls. Ungated it took 4337
    # calls at precision 0.006 (earlier: 3514 loci and 46.4% of the read mass):
    # phase_number >= 5 is common by chance in the deepest hc-siRNA loci, whose
    # phase_pvalue is ~1.0. The true rice calls have a median phase_pvalue of
    # 0.007 (222 calls at precision 1.0).
    enabled: true
    # Provisional: chosen on tuning libraries only (rice, fly, Arabidopsis).
    # A record with a larger phase_pvalue gets no phase term and no phase
    # defining strength, whatever its phase_number.
    phase_max_pvalue: 0.01
    size: {lo: 24, hi: 24}
    w_size: 1.0
    w_phase: 4.0
    phase_on: cycles
    defining_evidence: [phase, size]
    # 4 phase cycles of read span (21/24 nt x 4): fewer cycles cannot show phasing; PhaseTank requires >= 4 phased reads within 84 nt (Guo et al., 2015). Below it the locus is downgraded to ambiguous/review (user decision 2026-11-06).
    cluster_min_length: 96
  # DCL3 products from RDR2 dsRNA: 24 nt, 5'A, AGO4/RdDM. Repeat- and
  # TE-derived, dual-strand, and NOT phased.
  hcsiRNA:
    size: {lo: 23, hi: 24}
    w_size: 1.0
    w_5a: 1.0
    w_fractop_mid: 0.5
    defining_evidence: [5a, size]
  # Everything else double-stranded in the DCL4/DCL2 range: nat-siRNA, viral
  # siRNA, secondary siRNA without a clean register.
  siRNA:
    size: {lo: 21, hi: 22}
    w_size: 1.0
    w_fractop_mid: 1.0
    defining_evidence: [fractop_bid, size]

# Model used by `classify --classifier ml` (path from the repo root; --ml-model overrides). Ignored in the default rules mode.
ml:
  model: models/plant.joblib
