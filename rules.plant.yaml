# rules.plant.yaml — scoring config for PLANTS.
#
# STATUS: calibrated and validated on SRR30831721 (Arabidopsis Col-0 flower
# buds, 24.1M reads, BioProject PRJNA1011929). All six TAS loci come out as
# phasiRNA at 21nt, and the genome is 82% 24-nt hcsiRNA with 5'A enriched there
# (0.512) against 21-22nt (0.330). See docs/ROADMAP.md item 14.
# Validated on ONE dataset of ONE tissue of ONE species: treat as a good
# starting point for another plant, not as a universal default.
#
# Why a separate file at all — plants are not arthropods:
#   * There is no piRNA class: plants have no PIWI proteins.
#   * There is no ping-pong cycle either, for the same reason, so no w_pingpong.
#   * The 24-nt window, which in arthropods is piRNA territory, belongs to
#     heterochromatic siRNA (DCL3 -> AGO4, the RdDM pathway) and is one of the
#     most abundant classes in vegetative tissue.
#   * The 5' base sorts the small RNA into an Argonaute: 5'U -> AGO1 (miRNA,
#     tasiRNA/phasiRNA), 5'A -> AGO4 (hc-siRNA). Hence w_1u and w_5a.
#
# miRNA is not scored here: as in the arthropod config it comes from
# --mirna-loci (overlap with a curated BED) and bypasses the scorer.
clustering:
  pad: 500
extractor:
  dicermin: 18
  dicermax: 35
  strand_cutoff: 0.8
decision:
  # 0.43 here is as strict as the 0.6 the arthropod config uses, NOT looser.
  # The threshold is on a softmax, so its meaning depends on how many classes
  # compete. With two classes, conf >= 0.6 means a margin of ln(1.5) = 0.405
  # over the rival. With three, it means e^m/(e^m+2) >= 0.6, i.e. a margin of
  # 1.10 -- nearly three times stricter by accident. 0.43 restores the intended
  # 0.41 margin. Keeping 0.6 sent 39.6% of loci to review on confidence alone.
  review_confidence: 0.43
  min_margin: 0.15
  min_reads: 10
classes:
  # DCL4 products from RDR6 dsRNA: 21 nt, strongly phased (that is the defining
  # evidence), 5'U, loaded into AGO1.
  #
  # Calibrated on SRR30831721 (Col-0 flower buds) against the six TAS loci:
  #   * w_size is deliberately LOW (0.5) and w_phase HIGH. With w_size at 1.0 the
  #     size window alone carried the class, so every 21-22nt locus landed here
  #     regardless of phasing: 6557 loci, of which only 2.8% had any phasing
  #     evidence, while the siRNA class was left with 311. Now the class costs
  #     real phasing to enter.
  #   * phase_scale 1.5 instead of the default 3.0: the wide sigmoid returned
  #     0.159 for a phase_score of ZERO, handing out 0.24 of free score. The
  #     narrow one gives 0.035.
  #   * w_1u is low because in this tissue 5'U barely separates 21-22nt loci
  #     (mean 0.345) from the 5'A background (0.330).
  # Result: 1136 phasiRNA loci, siRNA in use (2715), and all six TAS loci
  # recovered (see extras/validate_plant_tas.py).
  phasiRNA:
    size: {lo: 21, hi: 22}
    w_size: 0.5
    w_phase: 3.0
    phase_x0: 5.0
    phase_scale: 1.5
    w_1u: 0.3
    defining_evidence: [phase]
  # DCL3 products from RDR2 dsRNA: 24 nt, 5'A, AGO4/RdDM. Repeat- and
  # TE-derived, dual-strand, and NOT phased.
  hcsiRNA:
    size: {lo: 23, hi: 24}
    w_size: 1.0
    w_5a: 1.0
    w_fractop_mid: 0.5
    defining_evidence: [5a]
  # Everything else double-stranded in the DCL4/DCL2 range: nat-siRNA, viral
  # siRNA, secondary siRNA without a clean register.
  siRNA:
    size: {lo: 21, hi: 22}
    w_size: 1.0
    w_fractop_mid: 1.0
    defining_evidence: [fractop_bid]
